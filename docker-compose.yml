      REPO_URL:      "git@github.com:my-org/taskmaster.git"
      MCP_PORT:      "8080"
    ports:
      - "8087:8080"

  #-----------------------------------------------------------------------------
  # 8) Docker Sandbox MightRAG
  #-----------------------------------------------------------------------------
  docker-sandbox:
    image: mightrag-agent-base:latest
    container_name: rag-docker-sandbox
    restart: unless-stopped
    networks:
      - mightrag-net
    volumes:
      - shared-ssh:/home/rag/.ssh:ro
    environment:
      AGENT_NAME:    "docker-sandbox"
      SYSTEM_PROMPT: "You are the Docker Sandbox agent—experiment with arbitrary Docker tasks."
      REPO_URL:      "git@github.com:my-org/docker-sandbox.git"
      MCP_PORT:      "8080"
    ports:
      - "8088:8080"
      
